<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Bulletproof Brands — Bulletproof Script Management System" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/brand/bulletproof-shield.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bulletproof" />
    <title>Bulletproof Brands — Script Management System</title>
    <!-- Sets the theme before first paint so the page never flashes the wrong colours -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('smmpro.theme');
          var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#10131B' : '#FFFFFF');
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <style>html{background:#F6F8FB}html[data-theme=dark]{background:#090B10}</style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;background:#070A12;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;z-index:999999;user-select:none;">
        <div style="width:72px;height:72px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 25px rgba(239,68,68,0.5));margin-bottom:16px;">
          <img src="/brand/bulletproof-shield.png" width="72" height="72" alt="Bulletproof Brands" style="object-fit:contain;" />
        </div>
        <div style="font-size:22px;font-weight:900;letter-spacing:-0.5px;text-transform:uppercase;margin-bottom:2px;">BULLETPROOF <span style="color:#ef4444;">BRANDS</span></div>
        <div style="font-size:9.5px;font-weight:800;letter-spacing:2px;color:#f87171;text-transform:uppercase;margin-bottom:8px;">IMPOSSIBLE TO IGNORE</div>
        <div style="font-size:10px;font-weight:600;letter-spacing:1.5px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:24px;">BULLETPROOF SCRIPT MANAGEMENT</div>
        <div style="width:200px;height:4px;border-radius:999px;background:rgba(255,255,255,0.1);overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:50%;background:linear-gradient(90deg,#dc2626,#ef4444,#f59e0b);border-radius:999px;animation:splashPulse 1.2s infinite ease-in-out;"></div>
        </div>
      </div>
      <style>
        @keyframes splashPulse {
          0% { left: -40%; width: 35%; }
          50% { left: 35%; width: 60%; }
          100% { left: 105%; width: 35%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
