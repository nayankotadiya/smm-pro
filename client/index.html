<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="SMM PRO — internal content production workspace" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SMM PRO" />
    <title>SMM PRO</title>
    <!-- Sets the theme before first paint so the page never flashes the wrong colours -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('smmpro.theme');
          var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#10131B' : '#FFFFFF');
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <style>html{background:#F6F8FB}html[data-theme=dark]{background:#090B10}</style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;background:#070A12;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;z-index:999999;user-select:none;">
        <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#9333ea,#ec4899);display:flex;align-items:center;justify-content:center;box-shadow:0 0 35px rgba(99,102,241,0.5);margin-bottom:20px;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" style="color:white">
            <path d="M4 18V6h3.5l4.5 7 4.5-7H20v12h-3v-6.5l-4.5 7-4.5-7V18H4z" fill="currentColor" />
          </svg>
        </div>
        <div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;">SMM PRO</div>
        <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;color:rgba(199,210,254,0.6);text-transform:uppercase;margin-bottom:28px;">BULLETPROOF SCRIPT MANAGEMENT</div>
        <div style="width:200px;height:4px;border-radius:999px;background:rgba(255,255,255,0.1);overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:50%;background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899);border-radius:999px;animation:splashPulse 1.2s infinite ease-in-out;"></div>
        </div>
      </div>
      <style>
        @keyframes splashPulse {
          0% { left: -40%; width: 35%; }
          50% { left: 35%; width: 60%; }
          100% { left: 105%; width: 35%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
