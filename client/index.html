<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="SMM PRO — internal content production workspace" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SMM PRO" />
    <title>SMM PRO</title>
    <!-- Sets the theme before first paint so the page never flashes the wrong colours -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('smmpro.theme');
          var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#10131B' : '#FFFFFF');
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <style>html{background:#F6F8FB}html[data-theme=dark]{background:#090B10}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
