name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-typecheck:
    name: Type Check & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Type check server
        run: npx --workspace server tsc -p tsconfig.json --noEmit

      - name: Type check client
        run: npx --workspace client tsc --noEmit

  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: audit-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run server test suite
        run: npm test --workspace server

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client production bundle
        run: npm run build --workspace client

      - name: Build server production bundle
        run: npm run build --workspace server

      - name: Validate Docker build
        run: docker build -f server/Dockerfile -t smm-pro-api:latest .
